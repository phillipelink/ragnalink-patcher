[package]
name = "rpatchur"
version = "0.3.0"
authors = ["LinkZ <wanthost@gmail.com>"]
edition = "2018"
build = "build.rs"
description = "A customizable patcher for Ragnarok Online"

# Estes textos aparecem nas PROPRIEDADES do arquivo no Windows, no Gerenciador de
# Tarefas e em avisos de antivirus e do SmartScreen. Como este executavel vai ser
# distribuido pra centenas de jogadores, ele se apresenta como RagnaLinK - e nao
# como um projeto de terceiros que a pessoa nunca ouviu falar.
# Credito ao projeto de origem fica no README e nos arquivos de licenca, que
# continuam no repositorio.
[package.metadata.winres]
FileDescription = "Atualizador do RagnaLinK"
ProductName = "RagnaLinK"
ProductVersion = "0.3.0"
OriginalFilename = "RagnaLinK.exe"
CompanyName = "RagnaLinK"
LegalCopyright = "Copyright © 2026 RagnaLinK"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
gruf = { version = "0.2", path = "../gruf" }

open = "1.7.0"
web-view = "0.7.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"
futures = "0.3"
tokio = { version = "1.8", features = ["macros", "fs", "sync", "io-util"] }
reqwest = { version = "0.11", features = ["stream"] }
url = "2.2"
tempfile = "3.1"
log = { version = "0.4", features = ["release_max_level_off"] }
simple_logger = "1.11"
anyhow = "1.0"
serde_json = "1.0"
flume = "0.10"
tinyfiledialogs = "3.3"
structopt = "0.3"
scopeguard = "1.1"
advisory-lock = "0.3"

[target.'cfg(windows)'.dependencies]
# winuser/windef/minwindef/processthreadsapi entraram para os comandos de janela
# (minimizar e arrastar) que a interface chama quando o patcher roda sem a barra
# de titulo do Windows. Ver `janela_principal` em src/ui.rs.
winapi = { version = "0.3.6", features = ["shellapi", "winuser", "windef", "minwindef", "processthreadsapi"] }

[dev-dependencies]
twox-hash = "1.5"
walkdir = "2.3"
httptest = "0.13"
