<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta content="text/html;charset=utf-8" http-equiv="Content-Type">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>RagnaLinK - Atualizador</title>
<!--
  ============================================================================
   ATENCAO ANTES DE EDITAR ESTE ARQUIVO

   1) O MOTOR NAO E O CHROME. O rpatchur usa a crate web-view 0.7, que no
      Windows renderiza com MSHTML - o motor do Internet Explorer.
      NAO funcionam aqui:
        JS  - fetch, let, const, arrow function, template string, Promise,
              classList, addEventListener com opcoes
        CSS - var(--x), grid, flexbox com gap, clamp(), filter, transform 3D
      Use var, XMLHttpRequest, posicionamento absoluto e className.

   2) TAMANHO: 1200x800. A proporcao TEM que ser 3:2, igual a da arte original
      (1536x1024). Todas as medidas deste arquivo foram tiradas a mao sobre a
      arte reduzida a 900x600 e depois multiplicadas por 4/3 - se um dia o
      tamanho mudar de novo, o caminho e o mesmo: mexer no W,H do fundo2.py e
      reescalar tudo aqui pelo novo fator. Bordas de 1px NAO escalam.

   3) A TELA E UMA IMAGEM. Moldura, ilustracao, logo, nome do episodio, Poring,
      caixas, botoes e barra de baixo estao PINTADOS no fundo.png. Este arquivo
      desenha so o que MUDA. Por isso quase tudo tem posicao absoluta em pixel:
      precisa cair exatamente onde a arte reservou.
      Mexeu na arte? Regere o fundo com o fundo2.py, que tambem regera o
      resources/forma.txt do recorte da janela - e ai PRECISA recompilar, porque
      o forma.txt vai embutido no executavel.

   4) NADA AQUI EXISTE PRA TAPAR PINTURA. Na arte anterior havia um painel de
      600x132 no topo, cuja unica funcao era esconder um cartao e uma fileira de
      pilulas que vinham desenhados. A arte nova veio com o topo limpo, entao a
      faixa de status pode ser fina e semitransparente. Se um dia a arte voltar
      a trazer esses elementos, isto aqui volta a ser um tapume.

   5) A JANELA E RECORTADA. A silhueta (cantos chanfrados e a crista do topo)
      vem do SetWindowRgn, no lado Rust, a partir do resources/forma.txt. O que
      cair fora dela simplesmente NAO APARECE, sem aviso nenhum.

   6) AS SEIS FUNCOES patchingStatus*/notification* SAO CHAMADAS PELO PATCHER.
      Se sumirem, a atualizacao roda em silencio e o jogador acha que travou.
  ============================================================================
-->
<style>
  /* 🚨 NADA de largura/altura fixa no html/body. Sem a barra de titulo, o
     Windows entrega como area de conteudo tambem o espaco que a moldura
     ocupava, e com medida fixa sobrava uma faixa em "L" na direita e embaixo.
     O `ajustar_janela` corrige o tamanho da janela ao abrir. */
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#050a12; color:#e6eefb;
    font-family:"Segoe UI", Tahoma, sans-serif;
    -ms-user-select:none; user-select:none; cursor:default; }

  #fundo { position:absolute; left:0; top:0; width:1200px; height:800px;
    background:url('fundo.png') no-repeat 0 0; }

  /* ---------------- controles de janela ---------------- */
  /* Os simbolos ja estao PINTADOS na arte (minimizar em 820..831 e fechar em
     850..859, na altura 32..41). Aqui so a area clicavel e o realce. */
  .btJanela { position:absolute; top:35px; height:32px; border-radius:8px;
    cursor:pointer; }
  #btMin { left:1083px; width:36px; }
  #btX   { left:1121px; width:37px; }
  .btJanela:hover { background:rgba(255,255,255,.18); }
  #btX:hover { background:rgba(214,64,64,.78); }

  /* ---------------- faixa de status ---------------- */
  /* Uma linha so e fundo translucido: com o topo da arte livre, a paisagem
     aparece atras em vez de ficar tapada por um painel. O conteudo flui em
     linha (spans inline) e nao em posicoes fixas, porque nome de raca varia
     muito de tamanho - "Bruto" e "Demi-Humano" nao ocupam o mesmo espaco, e
     posicao fixa faria um encavalar no outro. */
  /* 🚨 SEM largura fixa, e ancorada pela DIREITA.
     Com largura fixa ela sobrava dos dois lados: o conteudo varia de 637px
     ("Inseto") a 738px ("Demi-Humano") conforme o nome da raca, e qualquer
     numero fixo fica grande demais pra um e pequeno pro outro.
     Sem `width` e com `right`, a caixa encolhe ate o texto e cresce pra
     ESQUERDA - ou seja, LONGE dos simbolos de minimizar e fechar, que ficam em
     1093..1108. O `right:150px` trava a borda direita em 1050 e garante 43px de
     folga deles, aconteca o que acontecer com o texto.
     Se algum dia o Internet Explorer esticar isso em vez de encolher, o
     conserto e voltar pra `left:331px; width:736px`. */
  #faixa { position:absolute; right:150px; top:37px; max-width:780px;
    height:48px;
    line-height:48px; padding:0 24px; background:rgba(8,18,30,.68);
    border:1px solid rgba(120,180,220,.35); border-radius:24px;
    font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #faixa .luz { display:inline-block; width:11px; height:11px; border-radius:50%;
    background:#6b7a8c; margin-right:9px; vertical-align:middle; }
  #faixa .luz.on  { background:#3ddc97; }
  #faixa .luz.off { background:#ff5a5a; }
  #faixa .ok   { color:#3ddc97; font-weight:600; }
  #faixa .nao  { color:#ff6b6b; font-weight:600; }
  #faixa .num  { color:#eaf2ff; font-weight:600; }
  #faixa .rot  { color:#93a9c2; }
  #faixa .raca { color:#f5b83c; font-weight:700; }
  #faixa .bon  { color:#3ddc97; font-weight:600; }
  #faixa .sep  { color:#5b7590; margin:0 12px; }

  /* ---------------- lista de noticias ---------------- */
  /* 🚨 `scroll` e nao `auto`. Com `auto` a barra so aparece quando o conteudo
     passa da altura, e hoje o servidor tem duas noticias publicadas - entao ela
     nunca aparecia e dava a impressao de que a rolagem estava quebrada. Com
     `scroll` o trilho fica sempre no lugar, igual a arte desenha, e o jogador ve
     de cara que a caixa rola. */
  #lista { position:absolute; left:40px; top:355px; width:280px; height:195px;
    overflow-y:scroll; overflow-x:hidden;
    /* barra de rolagem no tom da arte. Propriedades exclusivas do Internet
       Explorer - em outro motor seriam ignoradas, mas aqui o motor E o do IE. */
    scrollbar-face-color:#1d3a4e; scrollbar-track-color:#0d1a26;
    scrollbar-arrow-color:#7fb4d8; scrollbar-shadow-color:#0d1a26;
    scrollbar-highlight-color:#0d1a26; scrollbar-3dlight-color:#0d1a26;
    scrollbar-darkshadow-color:#0d1a26; }
  /* Um item no formato que a ARTE desenha: a data numa coluna estreita a
     esquerda e titulo mais resumo no meio.
     Nao ha botao de expandir. Esta caixa e vitrine: mostra o resumo e quem
     quiser a noticia inteira clica e le no site. Cheguei a colocar um [+] que
     abria o resto do texto aqui dentro e foi removido - resolvia um problema que
     nao existe e enchia a caixa de botao. */
  .item { position:relative; padding:0 0 13px; margin:0 0 13px;
    border-bottom:1px solid rgba(120,170,210,.16); }
  .item .dia { position:absolute; left:2px; top:1px; width:44px;
    font-size:13px; color:#8ea6c0; }
  .item .cx  { margin-left:50px; margin-right:6px; cursor:pointer; }
  .item .tit { font-size:15px; font-weight:600; color:#e6eefb; margin:0 0 3px; }
  .item .cx:hover .tit { color:#9adcff; }
  .item.fixa .tit { color:#f5b83c; }
  .item.fixa .cx:hover .tit { color:#ffd27a; }
  .item .txt { font-size:13px; color:#93a9c0; line-height:1.4; }

  /* Medido na arte: o botao pintado ocupa 90..176 em x e 418..436 em y. */
  #verTodas { position:absolute; left:120px; top:557px; width:115px; height:24px;
    cursor:pointer; border-radius:5px; }
  #verTodas:hover { background:rgba(255,255,255,.12); }

  /* ---------------- painel de progresso ---------------- */
  /* A moldura arredondada continua sendo a pintada; daqui pra dentro e ao vivo.
     🚨 Duas medidas que ja deram errado aqui. Nada pode passar de x=880: a borda
     direita pintada do painel esta em x=901. E o texto comeca em 612, nao em
     604: a borda de cima esta em 604 e o texto encostado nela ficava com cara de
     defeito. O painel util e 604..688, e o conteudo se distribui com 8px de
     folga em cima e 6 embaixo. */
  #estado { position:absolute; left:193px; top:612px; width:555px;
    font-size:17px; font-weight:600; color:#eaf2ff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #trilho { position:absolute; left:193px; top:640px; width:555px; height:19px;
    background:#0b1521; border-radius:9px; overflow:hidden;
    border:1px solid rgba(70,120,165,.5); }
  #barra { width:0; height:100%; background:#0098ea; }
  #barra.erro { background:#e04b4b; }
  #barra.pronto { background:#3ddc97; }
  #pct { position:absolute; left:758px; top:626px; width:122px; text-align:right;
    font-size:29px; font-weight:700; color:#4fc3f7; }
  #detalhes { position:absolute; left:193px; top:664px; width:555px;
    font-size:14px; color:#8ea3ba;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #detalhes b { color:#cfe0f2; font-weight:600; }

  /* ---------------- botoes ---------------- */
  /* Todos ja estao PINTADOS. Estes retangulos sao a area clicavel e os estados,
     e as medidas saem da propria arte - chutar aqui ja deu realce menor que o
     botao uma vez. */
  .zona { position:absolute; cursor:pointer; }
  .zona i { display:block; width:100%; height:100%; border-radius:11px; }
  .zona:hover i { background:rgba(255,255,255,.14); }
  .zona:active i { background:rgba(0,0,0,.28); }

  /* Alturas medidas na arte em 1200x800, varrendo a coluna x=975 por cor: o
     Criar Conta (azul) vai de 596 a 644, o VIP (dourado) de 653 a 698. Antes eu
     tinha convertido as medidas de 900x600 arredondando pra cima, e sobrava
     realce embaixo dos dois. */
  #btCriar { left:957px; top:596px; width:200px; height:48px; }
  #btVip   { left:957px; top:653px; width:200px; height:45px; }
  #btJogar { left:424px; top:703px; width:347px; height:68px; }
  #btJogar i { border-radius:33px; }
  /* Desligado: o Jogar so libera quando o patcher responde. Sem filter no IE, o
     jeito de "apagar" o botao e uma camada cinza-azulada por cima. */
  #btJogar.off { cursor:default; }
  #btJogar.off i { background:rgba(46,56,72,.66); }
  #btJogar.off:hover i, #btJogar.off:active i { background:rgba(46,56,72,.66); }

  .link { position:absolute; top:733px; height:29px; cursor:pointer;
    border-radius:5px; }
  .link:hover { background:rgba(255,255,255,.12); }
  #lnSite { left:44px;  width:95px; }
  #lnFace { left:161px; width:100px; }
  #lnDisc { left:271px; width:100px; }

  #versao { position:absolute; right:40px; top:737px; font-size:14px;
    color:#7d93ab; }
</style>
</head>
<body>

<!-- Arrastar pega no FUNDO. Vai no onmousedown, e nao no onclick: do lado Rust
     o truque e fingir um clique na barra de titulo, e o Windows so entra no
     laco de mover enquanto o botao esta pressionado. -->
<div id="fundo" onmousedown="arrastar()"></div>

<div class="btJanela" id="btMin" onmousedown="pararAqui(event)" onclick="chamar('minimize')" title="Minimizar"></div>
<div class="btJanela" id="btX"   onmousedown="pararAqui(event)" onclick="chamar('exit')"     title="Fechar"></div>

<div id="faixa" onmousedown="pararAqui(event)">
  <span class="luz" id="luz"></span><span id="vStatus" class="rot">verificando...</span><span class="sep">&middot;</span><span id="vJogadores" class="num">--</span><span class="sep">&middot;</span><span class="rot">Ra&ccedil;a da vez:</span> <span id="vRaca" class="raca">--</span> <span id="vBonus" class="bon"></span><span id="vTempo"></span>
</div>

<div id="lista"></div>
<div id="verTodas" onmousedown="pararAqui(event)" onclick="abrir('/noticias')" title="Ver todas as notícias no site"></div>

<div id="estado">Verificando atualizações...</div>
<div id="trilho"><div id="barra"></div></div>
<div id="pct"></div>
<div id="detalhes"></div>

<div class="zona" id="btCriar" onmousedown="pararAqui(event)" onclick="abrir('/Conta/Registro')" title="Criar uma conta no site"><i></i></div>
<div class="zona" id="btVip"   onmousedown="pararAqui(event)" onclick="abrir('/PainelControle#doacoes')" title="VIP e doações"><i></i></div>
<div class="zona off" id="btJogar" onmousedown="pararAqui(event)" onclick="jogar()"><i></i></div>

<div class="link" id="lnSite" onmousedown="pararAqui(event)" onclick="abrir('/')" title="Site oficial"></div>
<div class="link" id="lnFace" onmousedown="pararAqui(event)" onclick="abrirFora(URL_FACEBOOK)" title="Facebook"></div>
<div class="link" id="lnDisc" onmousedown="pararAqui(event)" onclick="abrirFora(URL_DISCORD)" title="Discord"></div>

<div id="versao">Vers&atilde;o 1.0</div>

<script>
/* ==================================================================== */
/* ponte com o patcher                                                  */
/* ==================================================================== */
var pronto = false;

/* 🚨 ATENCAO AO FORMATO - foi o bug que deixou TODOS os botoes mortos.
   O invoke_handler do patcher (rpatchur/src/ui.rs) casa a mensagem por STRING
   CRUA:

       match arg {
           "play" => ..., "setup" => ..., "exit" => ...,
           "start_update" => ..., "cancel_update" => ...,
           "reset_cache" => ..., "manual_patch" => ...,
           "ajustar_janela" => ..., "moldar_janela" => ...,
           "minimize" => ..., "drag" => ...,
           request => handle_json_request(webview, request),
       }

   Comando embutido vai como TEXTO PURO. Mandar {"function":"play"} cai no ramo
   JSON, que so conhece 'login' e 'open_url' - o patcher escreve "Unknown
   function" num log sem console e NAO FAZ NADA. Falha 100% silenciosa. */
function chamar(nome) {
  try { external.invoke(nome); } catch (e) { /* aberto fora do patcher */ }
}

/* O formato JSON vale SO para 'login' e 'open_url'. */
function chamarJson(nome, params) {
  try {
    external.invoke(JSON.stringify({ "function": nome, "parameters": params || {} }));
  } catch (e) { }
}

/* 🚨 NAO usar `typeof external.invoke` como guarda. No Internet Explorer o
   `external` e objeto COM do hospedeiro e o typeof devolve "undefined" para
   metodos que existem e funcionam. Chamar dentro de try/catch, sempre. */
function jogar() { if (pronto) { chamar('play'); } }
function arrastar() { chamar('drag'); }

/* Impede que o mousedown num painel ou botao suba ate o fundo e vire arrasto. */
function pararAqui(e) {
  e = e || window.event;
  if (e.stopPropagation) { e.stopPropagation(); } else { e.cancelBubble = true; }
}

/* PATCH MANUAL - sem botao na tela, so por Ctrl+Shift+M. Aplica um .thor do
   disco sem passar pelo servidor: serve pra testar um patch antes de publicar e
   pra socorrer um jogador com download quebrado. Deixar visivel so convidaria o
   jogador a escolher um arquivo qualquer e aplicar dentro da GRF dele. */
document.onkeydown = function (e) {
  e = e || window.event;
  if (e.ctrlKey && e.shiftKey && e.keyCode === 77) { chamar('manual_patch'); }
};

function id(x) { return document.getElementById(x); }
function texto(t) { id('estado').innerHTML = t; }

function progresso(p, classe) {
  if (p < 0) { p = 0; } if (p > 100) { p = 100; }
  id('barra').style.width = p + '%';
  id('barra').className = classe || '';
  id('pct').innerHTML = p > 0 ? (p + '%') : '';
}

function detalhes(t) { id('detalhes').innerHTML = t || ''; }

function liberar(v) {
  pronto = v;
  id('btJogar').className = v ? 'zona' : 'zona off';
}

/* ==================================================================== */
/* as seis funcoes que o PATCHER chama. Nao renomear.                   */
/* ==================================================================== */
function patchingStatusReady() {
  marcarResposta();
  progresso(100, 'pronto');
  texto('Tudo atualizado. Bom jogo!');
  detalhes('');
  liberar(true);
}
function patchingStatusError(msg) {
  marcarResposta();
  progresso(100, 'erro');
  texto('Erro na atualização: ' + msg);
  detalhes('');
  liberar(true);   /* libera assim mesmo: nao prender o jogador por causa do patch */
}
function patchingStatusDownloading(baixados, total, bytesPorSeg) {
  var pct = total > 0 ? Math.floor((baixados * 100) / total) : 0;
  progresso(pct);
  texto('Baixando atualizações');
  /* 🚨 O patcher entrega CONTAGEM DE PATCHES e velocidade - nao entrega nome de
     arquivo nem tempo restante. A arte previa tres campos aqui; em vez de
     inventar numero, mostramos os dois que existem de verdade. */
  var d = 'Patch <b>' + baixados + '</b> de <b>' + total + '</b>';
  if (bytesPorSeg > 0) {
    d += ' &nbsp;|&nbsp; Velocidade: <b>' + (bytesPorSeg / 1048576).toFixed(2) + ' MB/s</b>';
  }
  detalhes(d);
  liberar(false);
}
function patchingStatusInstalling(instalados, total) {
  var pct = total > 0 ? Math.floor((instalados * 100) / total) : 0;
  progresso(pct);
  texto('Aplicando atualizações');
  detalhes('Patch <b>' + instalados + '</b> de <b>' + total + '</b>');
  liberar(false);
}
function patchingStatusPatchApplied(nome) {
  detalhes('Aplicado: <b>' + nome + '</b>');
}
/* O patcher chama esta se pedirem atualizacao com uma ja em andamento. Precisa
   EXISTIR: ele injeta a chamada por eval, e funcao indefinida vira erro de
   script dentro da janela. */
function notificationInProgress() { texto('Atualização já está em andamento...'); }

/* ==================================================================== */
/* conteudo ao vivo do site (opcional - se falhar, some sem barulho)     */
/* ==================================================================== */
/* Versao mostrada no rodape. Um lugar so pra mexer. */
var VERSAO = '1.0';
var SITE = 'https://ragnalink.com.br';

/* 🚨 PREENCHER. Enquanto estiverem vazios, os dois atalhos do rodape abrem o
   site em vez da rede - de proposito. Botao que leva a 404 e pior que botao que
   leva ao lugar generico: o jogador acha que o servidor esta quebrado. */
var URL_FACEBOOK = '';
var URL_DISCORD  = '';

/* Quando a pagina esta HOSPEDADA no proprio site, usa a origem dela: as
   chamadas viram MESMA ORIGEM (o IE bloqueia XHR entre origens quando a pagina
   vem de file://) e o endereco fixo acima nao precisa ser mexido se o dominio
   mudar. Aberta por file:// o protocolo e 'file:' e o valor fixo continua. */
if (location.protocol === 'http:' || location.protocol === 'https:') {
  SITE = location.protocol + '//' + location.host;
}

/* 🚨 NUNCA usar <a href> nesta pagina. Link normal navega a PROPRIA JANELA do
   patcher: o jogador perde a tela e o botao Jogar, e nao ha barra de navegador
   nem botao voltar pra desfazer. O open_url do rpatchur abre no navegador
   PADRAO do sistema. */
function abrir(caminho) { chamarJson('open_url', { url: SITE + caminho }); }
function abrirFora(url) { chamarJson('open_url', { url: url || SITE }); }

/* 🚨 ARMADILHA DO IE: ele CACHEIA resposta de XHR GET pela URL. Sem o parametro
   descartavel abaixo, da segunda consulta em diante voltaria a MESMA resposta
   da primeira - jogadores online e contador da raca ficariam congelados
   enquanto a janela estivesse aberta, e pareceria que o site travou. */
var seq = 0;
function buscar(url, aoReceber) {
  seq = seq + 1;
  var sep = url.indexOf('?') >= 0 ? '&' : '?';
  var x = new XMLHttpRequest();
  try { x.open('GET', url + sep + '_=' + new Date().getTime() + '.' + seq, true); }
  catch (e) { return; }
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || x.status !== 200) { return; }
    var dados;
    try { dados = JSON.parse(x.responseText); } catch (e) { return; }
    aoReceber(dados);
  };
  try { x.send(); } catch (e) { }
}

function escapar(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function pintarStatus(d) {
  if (!d) { return; }
  var on = !!d.online;
  id('luz').className = 'luz ' + (on ? 'on' : 'off');
  id('vStatus').className = on ? 'ok' : 'nao';
  id('vStatus').innerHTML = on ? 'Online' : 'Offline';
  var n = (on && d.jogadores >= 0) ? d.jogadores : 0;
  id('vJogadores').innerHTML = n + (n === 1 ? ' jogador' : ' jogadores');
}

var rdvSegundos = -1;
function rdvTempo() {
  var alvo = id('vTempo');
  if (rdvSegundos < 0) { alvo.innerHTML = ''; return; }
  if (rdvSegundos === 0) {
    alvo.innerHTML = '<span class="sep">&middot;</span><span class="rot">sorteando</span>';
    return;
  }
  var h = Math.floor(rdvSegundos / 3600), m = Math.floor((rdvSegundos % 3600) / 60);
  alvo.innerHTML = '<span class="sep">&middot;</span><span class="rot">muda em ' +
                   (h > 0 ? (h + 'h ' + m + 'min') : (m + 'min')) + '</span>';
}

function pintarRdv(d) {
  if (!d) { return; }
  if (!d.ativa) { rdvSegundos = 0; rdvTempo(); return; }
  id('vRaca').innerHTML = escapar(d.racaNome);
  id('vBonus').innerHTML = d.bonusExp > 0 ? ('+' + d.bonusExp + '% EXP') : '';
  rdvSegundos = d.segundosRestantes;
  rdvTempo();
}

/* A API de hoje devolve UMA noticia (objeto). Se um dia virar lista, este
   codigo ja aceita as duas formas - assim o dia da troca nao quebra o patcher
   que ja esta na maquina dos jogadores. */
function pintarNoticia(d) {
  if (!d) { return; }
  var itens = (typeof d.length === 'number') ? d : [d];
  var validos = [], i;
  for (i = 0; i < itens.length; i++) {
    if (itens[i] && itens[i].titulo) { validos.push(itens[i]); }
  }
  if (!validos.length) { return; }

  var html = '';
  for (i = 0; i < validos.length && i < 8; i++) {
    var n = validos[i];
    var d = escapar(n.data);
    /* A data sai como dd/MM na coluna estreita e o ano vai pro balaozinho do
       Windows: "28/07/2026" nao cabe em 44px, e o ano raramente importa numa
       lista das ultimas cinco. */
    html += '<div class="item' + (n.fixada ? ' fixa' : '') + '">' +
            '<div class="dia" title="' + d + '">' + d.substring(0, 5) + '</div>' +
            '<div class="cx" onclick="abrir(\'/noticias\')">' +
            '<div class="tit">' + escapar(n.titulo) + '</div>' +
            '<div class="txt">' + escapar(n.resumo) + '</div>' +
            '</div></div>';
  }
  id('lista').innerHTML = html;
}

/* -------- o unico relogio da pagina: bate de 10 em 10 segundos -------- */
var tique = 0;
setInterval(function () {
  tique = tique + 1;

  /* o contador da raca desce sozinho, sem consultar o site */
  if (rdvSegundos > 0) {
    rdvSegundos = rdvSegundos - 10;
    if (rdvSegundos < 0) { rdvSegundos = 0; }
    rdvTempo();
  }

  if (tique % 6 === 0) { buscar(SITE + '/api/status', pintarStatus); }

  /* raca: a cada 60 s. Quando o contador zera, aperta pra 20 s - a troca demora
     ate ~6 min pra chegar aqui (o rAthena so grava as variaveis globais no
     banco a cada 5 min, e o site ainda tem 60 s de cache), entao vale perguntar
     mais vezes justamente na janela em que muda. */
  if ((rdvSegundos <= 0 && tique % 2 === 0) || tique % 6 === 0) {
    buscar(SITE + '/api/raca-da-vez', pintarRdv);
  }

  /* noticia: a cada 5 min. Muda de semana em semana, nao de minuto em minuto. */
  if (tique % 30 === 0) { buscar(SITE + '/api/noticias', pintarNoticia); }
}, 10000);

/* ==================================================================== */
/* rede de seguranca                                                     */
/* ==================================================================== */
/* O Jogar so libera quando o patcher responde Ready ou Error. Se o servidor de
   patch estiver fora, lento ou inalcancavel, essa resposta pode demorar muito
   ou nao vir - e o jogador ficaria preso olhando "Verificando atualizacoes".
   Nunca deixe a possibilidade de jogar depender de o patch responder. */
var LIMITE_MS = 20000;
var respondeu = false;
function marcarResposta() { respondeu = true; }

setTimeout(function () {
  if (respondeu) { return; }
  texto('Não foi possível verificar atualizações. Você pode entrar assim mesmo.');
  progresso(0);
  detalhes('');
  liberar(true);
}, LIMITE_MS);

/* ==================================================================== */
/* abertura                                                             */
/* ==================================================================== */
/* ORDEM IMPORTA. Primeiro encaixar a janela no tamanho certo, so depois
   recortar: na ordem trocada existe um instante com a janela grande e ja
   recortada, que pisca feio na abertura. */
chamar('ajustar_janela');
chamar('moldar_janela');

texto('Verificando atualizações...');
chamar('start_update');

buscar(SITE + '/api/status', pintarStatus);
buscar(SITE + '/api/raca-da-vez', pintarRdv);
buscar(SITE + '/api/noticias', pintarNoticia);
</script>
</body>
</html>
