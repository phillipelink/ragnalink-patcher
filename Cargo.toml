[profile.release]
lto = true
panic = 'abort'

[workspace]
# rse/protocol entrou aqui na Fase 2 do RagnaShield Engine.
#
# E o unico crate do RSE que existe por enquanto - e de proposito: ele nao faz
# I/O nem toca em Windows API, entao `cargo test` do workspace inteiro continua
# rodando em qualquer maquina. O rse/loader e o rse/watchdog entram nas Fases 4
# e 5, e ai sim serao especificos de Windows/i686.
#
# Nada em gruf/, mkpatch/ ou rpatchur/ mudou nesta fase.
# rse/tools/smoke entrou na Fase 3b: prova o circuito do servidor de ponta a
# ponta (Auth Service -> login-server) antes de existir Loader ou DLL. E uma
# ferramenta de diagnostico, nao vai para o jogador.
#
# rse/loader entrou na Fase 4. E o unico membro do workspace que so compila para
# Windows de verdade - fora dele, os caminhos com API do sistema viram funcoes
# que devolvem erro, para o `cargo check` continuar valendo em qualquer maquina.
# O alvo de producao dele e i686-pc-windows-msvc, porque a DLL da Fase 5 tem que
# ter a mesma arquitetura do Ragexe.
#
# rse/tools/testdbg, testproc e testhandle entraram na Fase 6: cada um finge ser
# a ameaca que a deteccao correspondente procura (depurador anexado, processo
# proibido, handle com escrita), para dar de testar sem baixar ferramenta de
# cheat de verdade.
#
# O testhandle e o mais interessante dos tres: ele se chama `rse-testhandle.exe`
# e nao esta em lista de proibidos nenhuma. Mesmo assim a 6.4b o acusa, porque
# ela olha o handle e nao o nome. E a demonstracao de por que a 6.4b existe.
members = ["gruf", "mkpatch", "rpatchur", "rse/protocol", "rse/loader", "rse/watchdog", "rse/tools/smoke", "rse/tools/manifest", "rse/tools/testdbg", "rse/tools/testproc", "rse/tools/testhandle", "rse/tools/whoholds", "rse/tools/testpatch"]
